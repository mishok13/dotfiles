name: Verify Fish Scripts

on:
  push:
    branches:
      - main
    paths:
      - 'home-manager/fish/**'
      - '**/*.fish'
      - '.github/workflows/fish.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'home-manager/fish/**'
      - '**.fish'
      - '.github/workflows/fish.yaml'

permissions: {}

jobs:
  verify-fish-scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Verify Fish scripts
        run: |
          nix profile install nixpkgs#fish
          find home-manager/fish -name "*.fish" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file..."
            fish --no-execute "$file"
          done
