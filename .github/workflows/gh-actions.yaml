name: Lint

on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches: [main]

permissions: {}

jobs:
  verify-actions-lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
